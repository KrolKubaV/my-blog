name: Deploy to GitHub Pages

# Every push to master builds the site and publishes it at jadamek.com.
# To take it offline (publish only the small page in offline/), change
# SITE_ONLINE to 'false'.
env:
  SITE_ONLINE: 'true'

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        if: env.SITE_ONLINE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build the site
        if: env.SITE_ONLINE == 'true'
        run: npm ci && npm run build
      - name: Use the offline page instead
        if: env.SITE_ONLINE != 'true'
        run: mkdir -p dist && cp offline/* dist/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
